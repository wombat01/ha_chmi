name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/chmi/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Read version from manifest
        id: version
        run: echo "tag=v$(jq -r .version custom_components/chmi/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
